<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify your SaucamPro email</title>
</head>
<body style="background:#0f1117;margin:0;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" role="presentation" style="background:#1a1d27;border-radius:16px;padding:40px;max-width:480px;width:100%;">

          <!-- Logo -->
          <tr>
            <td style="text-align:center;padding-bottom:32px;">
              <span style="display:inline-flex;align-items:center;gap:10px;">
                <span style="display:inline-block;width:40px;height:40px;background:#2563eb;border-radius:10px;font-size:20px;font-weight:700;color:#fff;line-height:40px;text-align:center;">₿</span>
                <span style="font-size:22px;font-weight:700;color:#ffffff;">SaucamPro</span>
              </span>
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td style="color:#ffffff;font-size:22px;font-weight:600;text-align:center;padding-bottom:10px;">
              Verify your email address
            </td>
          </tr>

          <!-- Subtext -->
          <tr>
            <td style="color:#9ca3af;font-size:15px;text-align:center;line-height:1.6;padding-bottom:32px;">
              Thanks for signing up. Enter the code below in the app to activate your account.
            </td>
          </tr>

          <!-- OTP Code -->
          <tr>
            <td style="text-align:center;padding-bottom:32px;">
              <span style="display:inline-block;background:#1e3a8a;color:#ffffff;font-size:34px;font-weight:700;letter-spacing:12px;padding:18px 28px;border-radius:12px;border:1px solid #2563eb;">
                {{ .Token }}
              </span>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding-bottom:28px;">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td style="border-top:1px solid #2a2d3a;"></td>
                  <td style="color:#6b7280;font-size:12px;white-space:nowrap;padding:0 12px;">or verify with a link</td>
                  <td style="border-top:1px solid #2a2d3a;"></td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- CTA Button -->
          <tr>
            <td style="text-align:center;padding-bottom:32px;">
              <a href="{{ .ConfirmationURL }}"
                style="display:inline-block;background:#2563eb;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:14px 36px;border-radius:10px;">
                Verify my email
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="color:#6b7280;font-size:12px;text-align:center;line-height:1.6;">
              This code and link expire in 24 hours.<br>
              If you didn't create a SaucamPro account, you can safely ignore this email.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
